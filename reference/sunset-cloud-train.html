<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落日云间列车</title>
<!--
  「落日云间列车」—— Rice-dog/code-codex v0.2.15「Cloud Train Background」插件的独立提取改编版。
  渲染核心（CloudTrainRenderer）与 shader 组装逻辑原样提取自
  packages/explorer-ui/src/explorer-element.ts（commit 0902983a），
  供在没有 Codex Desktop / 非 Windows 环境下直接预览效果。
  原始 shader 作者是 mdb（源项目注释："Original supplied shader credited to mdb.
  No redistribution license was supplied."），请勿再分发。
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05090c; }
  body { font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #dfe9f2; }
  #cloud-train { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  header {
    position: fixed; top: 14px; left: 16px; z-index: 2; pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  header p { font-size: 11px; opacity: .72; margin-top: 2px; }

  #panel {
    position: fixed; right: 14px; bottom: 14px; z-index: 3; width: 264px;
    background: rgba(8, 14, 20, .78); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); overflow: hidden;
    opacity: 0; pointer-events: none; transition: opacity .6s ease;
  }
  #panel.shown { opacity: 1; pointer-events: auto; }
  #panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; cursor: pointer; user-select: none;
    background: rgba(255,255,255,.05);
  }
  #panel-head b { font-size: 13px; font-weight: 600; }
  #panel-toggle { border: none; background: none; color: #dfe9f2; font-size: 12px; cursor: pointer; opacity: .7; }
  #panel-body { padding: 4px 12px 12px; max-height: min(62vh, 520px); overflow-y: auto; }
  #panel.collapsed #panel-body { display: none; }

  fieldset { border: none; }
  legend { font-size: 11px; opacity: .55; padding: 8px 0 2px; letter-spacing: .05em; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 3px 0; }
  .row label { font-size: 12px; opacity: .88; display: flex; align-items: center; min-width: 0; }
  .row label .zh { white-space: nowrap; }
  .row label .mini-reset { flex-shrink: 0; }
  .row output { font-size: 11px; opacity: .75; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: #f0a35e; height: 18px; }
  .swatch { width: 44px; height: 20px; border-radius: 4px; border: 1px solid rgba(255,255,255,.35); cursor: pointer; }
  .swatch:hover { border-color: rgba(255,255,255,.7); }
  .mini-reset {
    border: 1px solid rgba(255,255,255,.55); background: transparent; color: #fff;
    font: inherit; font-size: 9px; line-height: 1.5; padding: 0 5px; margin-left: 6px;
    border-radius: 4px; cursor: pointer; vertical-align: 1px;
  }
  .mini-reset:hover { background: rgba(255,255,255,.16); border-color: #fff; }
  .toggle-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
  .toggle-row input { accent-color: #f0a35e; }

  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .actions button {
    flex: 1; padding: 6px 0; font-size: 11px; cursor: pointer;
    color: #dfe9f2; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px;
    white-space: nowrap;
  }
  .actions button:hover { background: rgba(255,255,255,.15); }

  /* 重置确认弹窗：居中 + 遮罩 */
  #modal-mask {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); backdrop-filter: blur(3px);
  }
  #modal-mask[hidden] { display: none; }
  #modal {
    background: rgba(16, 24, 32, .94); border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px; padding: 20px 22px 18px; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); max-width: 300px;
  }
  #modal-text { font-size: 14px; }
  #modal > small { display: block; font-size: 11px; opacity: .6; margin-top: 5px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 7px 0; font-size: 12px; cursor: pointer;
    color: #dfe9f2; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px;
  }
  .modal-actions button:hover { background: rgba(255,255,255,.15); }
  #modal-ok { background: #c96f3b; border-color: transparent; }
  #modal-ok:hover { background: #d97f49; }

  /* 内嵌取色器：占据滑杆列表位置，不打断面板层级 */
  #picker { padding: 2px 0 4px; margin: 4px 0; }
  #picker[hidden] { display: none; }
  .picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .picker-head b { font-size: 12px; font-weight: 600; }
  #picker-close {
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    color: #dfe9f2; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16); border-radius: 6px; cursor: pointer;
  }
  #picker-close:hover { background: rgba(255,255,255,.15); }
  #picker-sv { position: relative; height: 150px; border-radius: 8px; cursor: crosshair; }
  #picker-dot {
    position: absolute; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%;
    transform: translate(-50%, -50%); box-shadow: 0 0 4px rgba(0,0,0,.55); pointer-events: none;
  }
  .picker-mid { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  #picker-eyedropper {
    width: 26px; height: 26px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #dfe9f2; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16); border-radius: 6px; cursor: pointer;
  }
  #picker-eyedropper:hover { background: rgba(255,255,255,.15); }
  #picker-swatch {
    width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.65); box-sizing: border-box;
  }
  #picker-hue {
    flex: 1; height: 26px; margin: 0; -webkit-appearance: none; appearance: none;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    border-radius: 6px; cursor: pointer;
  }
  #picker-hue::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 26px; border-radius: 3px;
    background: #fff; border: 1px solid rgba(0,0,0,.4); cursor: pointer;
  }
  .picker-bottom { display: flex; align-items: stretch; gap: 6px; margin-top: 12px; }
  .picker-bottom .ch { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; opacity: .75; }
  .picker-bottom input {
    width: 100%; height: 30px; box-sizing: border-box; text-align: center;
    color: #dfe9f2; font: inherit; font-size: 13px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
    appearance: textfield; -moz-appearance: textfield;
  }
  .picker-bottom input::-webkit-inner-spin-button { display: none; }
  #picker-ok {
    flex: 1.15; margin-left: 2px; font-size: 13px; cursor: pointer;
    color: #fff; background: #c96f3b; border: none; border-radius: 6px;
  }
  #picker-ok:hover { background: #d97f49; }

  #err {
    display: none; margin-top: 8px; padding: 7px 9px; font-size: 11px;
    color: #ffd9d2; background: rgba(160, 40, 30, .35); border-radius: 8px;
    word-break: break-all;
  }
</style>
</head>
<body>
<canvas id="cloud-train"></canvas>

<header>
  <h1>落日云间列车</h1>
  <p>原项目: Rice-dog/code-codex</p>
</header>

<aside id="panel">
  <div id="panel-head">
    <div><b>落日云间列车设置</b></div>
    <button id="panel-toggle" aria-label="折叠/展开设置面板">▾</button>
  </div>
  <div id="panel-body">
    <fieldset id="controls"><legend>列车与云海</legend></fieldset>
    <div id="picker" hidden>
      <div class="picker-head">
        <b id="picker-title">调整颜色</b>
        <button id="picker-close" title="关闭（放弃本次修改）" aria-label="关闭取色器">
          <svg viewBox="0 0 16 16" width="12" height="12"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="picker-sv"><div id="picker-dot"></div></div>
      <div class="picker-mid">
        <button id="picker-eyedropper" title="从屏幕取色" aria-label="从屏幕取色">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M11.2 1.6l3.2 3.2-7.8 7.8L3 14l1.4-3.6ZM9.6 3.2l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </button>
        <div id="picker-swatch"></div>
        <input type="range" id="picker-hue" min="0" max="360" step="1" aria-label="色相">
      </div>
      <div class="picker-bottom">
        <div class="ch"><input type="number" id="picker-r" min="0" max="255">R</div>
        <div class="ch"><input type="number" id="picker-g" min="0" max="255">G</div>
        <div class="ch"><input type="number" id="picker-b" min="0" max="255">B</div>
        <button id="picker-ok">确认</button>
      </div>
    </div>
    <fieldset id="tint-controls"><legend>染色（默认色即原画配色）</legend></fieldset>
    <label class="toggle-row"><input type="checkbox" id="ctl-introEnabled" checked>启用开场动画</label>
    <label class="toggle-row"><input type="checkbox" id="ctl-paused">暂停动画</label>
    <div class="actions">
      <button id="btn-reset">一键重置</button>
      <button id="btn-save">记住当前设置</button>
      <button id="btn-replay">重播</button>
    </div>
    <p id="err"></p>
  </div>
</aside>

<div id="modal-mask" hidden>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-text">
    <p id="modal-text">回到初始化参数的状态？</p>
    <small>将清除已记录的个性化设置</small>
    <div class="modal-actions">
      <button id="modal-cancel">取消</button>
      <button id="modal-ok">确认重置</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ======== 设置定义（与源码 CLOUD_TRAIN_DEFAULTS / CLOUD_TRAIN_CONTROLS / CLOUD_TRAIN_TINTS 一致） ========
const CLOUD_TRAIN_DEFAULTS = {speed:.4,resolution:.75,feedback:.3,vignette:1,zoom:.8,offset:0,amplitude:.6,detail:8,exposure:1,saturation:1,hue:0,temperature:0,skyTint:"#94b3ff",smokeTint:"#ffffff",trainTint:"#7a3033",introEnabled:true,introDuration:3,introFeather:.15,paused:false};
const CLOUD_TRAIN_CONTROLS = [
["introDuration","开场时长（秒）",.5,10,.1],
["introFeather","开场羽化宽度",.02,.6,.01],
["speed","行进速度",0,5,.01],
["zoom","视角缩放",.5,2,.01],
["offset","垂直位置",-.5,.5,.01],
["amplitude","云层起伏",0,2,.01],
["detail","噪声细节",1,8,1],
["exposure","曝光亮度",.2,2,.01],
["saturation","色彩饱和度",0,2,.01],
["hue","整体色相",-180,180,1],
["temperature","冷暖色温",-1,1,.01],
["resolution","渲染比例",.25,1,.05],
["feedback","帧间拖影",0,.85,.01],
["vignette","暗角强度",0,1,.01],
];
const CLOUD_TRAIN_TINTS = [["skyTint","天空染色"],["smokeTint","烟雾染色"],["trainTint","列车染色"]];
const SAVED_SETTINGS_KEY = "cloud-train-saved-settings:v1";
function normalizeSettings(value) {
  const r = { ...CLOUD_TRAIN_DEFAULTS };
  if (!value || typeof value !== 'object') return r;
  for (const [key, , min, max] of CLOUD_TRAIN_CONTROLS) {
    const v = typeof value[key] === 'number' ? value[key] : parseFloat(value[key]);
    if (Number.isFinite(v)) r[key] = Math.min(max, Math.max(min, v));
  }
  r.detail = Math.round(r.detail);
  for (const [key] of CLOUD_TRAIN_TINTS) {
    if (typeof value[key] === 'string' && /^#[0-9a-f]{6}$/i.test(value[key])) r[key] = value[key];
  }
  for (const k of ['introEnabled', 'paused']) {
    if (typeof value[k] === 'boolean') r[k] = value[k];
  }
  return r;
}
let __saved = null;
try { __saved = JSON.parse(localStorage.getItem(SAVED_SETTINGS_KEY)); } catch { /* 存储不可用时用出厂默认 */ }
const settings = normalizeSettings(__saved);
// 迁移：旧乘法体系以白色为默认（=不染色），直选色体系下白色是有效选择，
// 因此把存档中的旧默认白色替换为新体系的出厂配色（烟雾保持乘法，白色仍是不染色）
if (__saved) {
  if (__saved.skyTint === '#ffffff') settings.skyTint = CLOUD_TRAIN_DEFAULTS.skyTint;
  if (__saved.trainTint === '#ffffff') settings.trainTint = CLOUD_TRAIN_DEFAULTS.trainTint;
}

// ======== shader 源码与组装（原样提取自 explorer-element.ts） ========
// Original supplied shader credited to mdb. No redistribution license was supplied.
// Preserve the source project's deterministic noise and previous-frame feedback assumptions.
// Tint within each material, before compositing and feedback. White is identity.
function cloudTrainColorizeSource(source) {
  // 天空改为直选色：选中色即天空色
  let result = source.replace('return vec4(0.58, 0.7, 1.0, 1.);', 'return vec4(skyTint, 1.);');
  const trainStart = result.indexOf('col = mix(col, vec3(0.18');
  const smokeStart = result.indexOf('// loco smoke');
  if(trainStart < 0 || smokeStart < 0) throw new Error('Train color source markers missing');
  // 列车改为直选色：trainRecolor 保留各部件明度、统一应用选中色的色相
  result = result.slice(0, trainStart) + result.slice(trainStart, smokeStart)
    .replace(/vec3\(([^()]*)\)/g, 'trainRecolor(vec3($1))') + result.slice(smokeStart);
  result = result.replace('if(y < 0.0) col = vec3(1.0, 0.94, 0.91);', 'if(y < 0.0) col = vec3(1.0, 0.94, 0.91)*smokeTint;')
    .replace('if(y < - 0.02) col = vec3(0.92, 0.85, 0.82);', 'if(y < - 0.02) col = vec3(0.92, 0.85, 0.82)*smokeTint;');
  return 'uniform vec3 skyTint, smokeTint, trainTint;\n' +
    'vec3 trainRecolor(vec3 base){\n' +
    '  float y = dot(base, vec3(.299,.587,.114));\n' +
    '  return clamp(trainTint * (y / max(dot(trainTint, vec3(.299,.587,.114)), 1e-4)), 0.0, 1.0);\n' +
    '}\n' + result;
}

// Reveal real depth layers, not rectangular screen bands. At intro=1 the
// original layer boundaries and material compositing are unchanged.
function cloudTrainOpeningSource(source) {
  return `uniform float intro, introFeather;
float openingLayer(float start) {
  if (intro >= 1.) return 1.;
  float width = mix(.08, .24, clamp(introFeather / .6, 0., 1.));
  return smoothstep(start, min(start + width, 1.), intro);
}
` + source
    .replace('#define layer(dh, v)  if (uv.y < h + midlevel - (dh) ) return vec4(v, 1.);',
      '#define layer(dh, v) { float p=openingLayer(dist>=10. ? .08+.60*(100.-dist)/90. : (dist>1.5 ? .78 : .88)); if(dist!=matchedDepth && uv.y < h + midlevel - (dh)) { matchedDepth=dist; accumulated.rgb+=(1.-accumulated.a)*p*(v); accumulated.a+=(1.-accumulated.a)*p; if(accumulated.a>=1.) return accumulated; } }')
    .replaceAll('float midlevel;', 'vec4 accumulated=vec4(0.); float matchedDepth=-1.; float midlevel;')
    .replace('return vec4(0.95, 0.80, 0.77, 0.);',
      'return vec4(accumulated.a>0. ? accumulated.rgb/accumulated.a : vec3(0.95,0.80,0.77),accumulated.a);')
    .replace('return vec4(skyTint, 1.);',
      'return vec4(accumulated.rgb+(1.-accumulated.a)*mix(vec3(.008,.035,.051),skyTint,openingLayer(0.)), 1.);')
    .replace('vec3 col = bg.rgb;', 'vec3 col = bg.rgb; vec3 openingBackground = col;')
    .replace('col = mix(col, fg.rgb, fg.a);',
      'col = mix(openingBackground, col, openingLayer(.70)); col = mix(col, fg.rgb, fg.a);');
}

function cloudTrainTintRgb(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return [1, 1, 1];
  return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
}

const SHADER_ORIGINAL = "float noise(vec2 x){\n    vec2 f = fract(x);\n    vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);\n    vec2 du = 30.0*f*f*(f*(f-2.0)+1.0);\n    \n    vec2 p = floor(x);\n\tfloat a = texture(iChannel0, (p+vec2(0.0, 0.0))/1024.0).x;\n\tfloat b = texture(iChannel0, (p+vec2(1.0,0.0))/1024.0).x;\n\tfloat c = texture(iChannel0, (p+vec2(0.0,1.0))/1024.0).x;\n\tfloat d = texture(iChannel0, (p+vec2(1.0,1.0))/1024.0).x;\n\n    \n\treturn a+(b-a)*u.x+(c-a)*u.y+(a-b-c+d)*u.x*u.y;\n}\n\nfloat fbm(vec2 x, int detail){\n    float a = 0.0;\n    float b = 1.0;\n    float t = 0.0;\n    for(int i = 0; i < detail; i++){\n        float n = noise(x);\n        a += b*n;\n        t += b;\n        b *= 0.7;\n        x *= 2.0; \n    \n    }\n    return a/t;\n}\n\nfloat fbm2(vec2 x, int detail){\n    float a = 0.0;\n    float b = 1.0;\n    float t = 0.0;\n    for(int i = 0; i < detail; i++){\n        float n = noise(x);\n        a += b*n;\n        t += b;\n        b *= 0.9;\n        x *= 2.0; \n    \n    }\n    return a/t;\n}\n\nfloat box(vec2 uv, float x1, float x2, float y1, float y2){\n    return (uv.x > x1 && uv.x < x2 && uv.y > y1 && uv.y < y2)?1.0:0.0;\n} \n\n#define dot2(v) dot(v, v)\n#define layer(dh, v)  if (uv.y < h + midlevel - (dh) ) return vec4(v, 1.);\n\nvec4 foreground(vec2 uv, float t){\n    float midlevel;\n    float h;\n    float disp;\n    float dist;\n    vec2 uv2;\n    \n    uv.y -= 0.2;\n    // clouds foreground //////////////////////////////////////////////////////////////\n    \n    // c14\n    midlevel = -0.1;\n    disp = 1.7;\n    dist = 1.0;\n    uv2 = uv + vec2(t/dist + 40.0, 0.0);\n    h = (fbm(uv2, 8) - 0.5)*disp;\n    layer(0.12, vec3(0.43, 0.32, 0.31));\n    layer(0.08, vec3(0.55, 0.42, 0.41));\n    layer(0.04, vec3(0.66, 0.42, 0.40));\n    layer(0., vec3(0.77, 0.48, 0.46));\n    \n    // c13\n    \n    midlevel = 0.05;\n    disp = 1.7;\n    dist = 2.0;\n    uv2 = uv + vec2(t/dist + 38.0, 0.0);\n    h = (fbm(uv2, 8) - 0.5)*disp;\n    layer(0.1, v     wakeRef.current = reset;
    let dprQuery;
    const dprChanged = () => {
      if (dprQuery) dprQuery.removeEventListener('change', dprChanged);
      dprQuery = matchMedia('(resolution: ' + (devicePixelRatio || 1) + 'dppx)');
      dprQuery.addEventListener('change', dprChanged);
      updatePixelSize(); reset();
    };
    dprChanged();
    const resize = new ResizeObserver(([entry]) => {
      if (!entry) return;
      cssWidth = entry.contentRect.width; cssHeight = entry.contentRect.height;
      updatePixelSize(); reset();
    });
    resize.observe(el);
    document.addEventListener('visibilitychange', reset);
    media.addEventListener('change', reset);
    request();
    return () => {
      resize.disconnect();
      if (dprQuery) dprQuery.removeEventListener('change', dprChanged);
      document.removeEventListener('visibilitychange', reset);
      media.removeEventListener('change', reset);
      wakeRef.current = () => {};
      clean();
    };
  } catch (e) { clean(); throw e; }
}

// ======== 装配与控制面板 ========
const canvas = document.getElementById('cloud-train');
const errBox = document.getElementById('err');
const panel = document.getElementById('panel');
const wakeRef = { current: () => {} };
let cleanup;
function boot() {
  if (cleanup) { cleanup(); cleanup = undefined; }
  errBox.style.display = 'none';
  panel.classList.remove('shown'); // 开场动画期间隐藏面板，播完再淡入
  try {
    cleanup = startCloudTrain(canvas, { current: settings }, wakeRef, {
      onIntroDone: () => panel.classList.add('shown'),
    });
  }
  catch (e) {
    errBox.textContent = '渲染失败：' + (e && e.message ? e.message : String(e));
    errBox.style.display = 'block';
    panel.classList.add('shown'); // 渲染失败时仍要能看到设置面板排查
  }
}
boot();

// 面板生成：滑杆与染色控件
const controlsBox = document.getElementById('controls');
const tintsBox = document.getElementById('tint-controls');
for (const [key, zh, min, max, step] of CLOUD_TRAIN_CONTROLS) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label for="ctl-${key}"><span class="zh">${zh}</span><button type="button" class="mini-reset" title="恢复该项默认">重置</button></label><output id="out-${key}">${settings[key]}</output>` +
    `<input type="range" id="ctl-${key}" min="${min}" max="${max}" step="${step}" value="${settings[key]}">`;
  controlsBox.appendChild(row);
  row.querySelector('input').addEventListener('input', ev => {
    settings[key] = parseFloat(ev.target.value);
    document.getElementById('out-' + key).textContent = settings[key];
    wakeRef.current();
  });
  // 单项重置：仅把这一个滑杆恢复默认，不影响其他参数
  row.querySelector('.mini-reset').addEventListener('click', ev => {
    ev.preventDefault(); // 阻止 label 转发点击
    settings[key] = CLOUD_TRAIN_DEFAULTS[key];
    document.getElementById('ctl-' + key).value = settings[key];
    document.getElementById('out-' + key).textContent = settings[key];
    wakeRef.current();
  });
}
for (const [key, zh] of CLOUD_TRAIN_TINTS) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label for="ctl-${key}"><span class="zh">${zh}</span><button type="button" class="mini-reset" title="恢复该项默认">重置</button></label>` +
    `<div class="swatch" id="ctl-${key}" style="background:${settings[key]}" title="点击选择颜色"></div>`;
  tintsBox.appendChild(row);
  row.querySelector('.swatch').addEventListener('click', () => openPicker(key));
  // 单项重置：仅把这一个染色恢复默认，不影响其他参数
  row.querySelector('.mini-reset').addEventListener('click', ev => {
    ev.preventDefault(); // 阻止 label 转发点击打开取色器
    settings[key] = CLOUD_TRAIN_DEFAULTS[key];
    document.getElementById('ctl-' + key).style.background = CLOUD_TRAIN_DEFAULTS[key];
    wakeRef.current();
  });
}
document.getElementById('ctl-introEnabled').addEventListener('change', ev => { settings.introEnabled = ev.target.checked; wakeRef.current(); });
document.getElementById('ctl-paused').addEventListener('change', ev => { settings.paused = ev.target.checked; wakeRef.current(); });
function syncUI() {
  for (const [key] of CLOUD_TRAIN_CONTROLS) {
    document.getElementById('ctl-' + key).value = settings[key];
    document.getElementById('out-' + key).textContent = settings[key];
  }
  for (const [key] of CLOUD_TRAIN_TINTS) document.getElementById('ctl-' + key).style.background = settings[key];
  document.getElementById('ctl-introEnabled').checked = settings.introEnabled;
  document.getElementById('ctl-paused').checked = settings.paused;
}
document.getElementById('btn-replay').addEventListener('click', boot);
// 记住当前设置：存入 localStorage，之后每次打开以最后保存的个性化参数进入
document.getElementById('btn-save').addEventListener('click', () => {
  if (!pickerBox.hidden) closePicker(true); // 取色器预览中的颜色一并提交后再记住
  try { localStorage.setItem(SAVED_SETTINGS_KEY, JSON.stringify(settings)); } catch { /* 隐私模式等场景下静默失败 */ }
  const btn = document.getElementById('btn-save');
  btn.textContent = '已记住 ✓';
  setTimeout(() => { btn.textContent = '记住当前设置'; }, 1600);
});
// 重置：先弹居中确认框，确认后清除已记录参数并回到出厂默认
const modalMask = document.getElementById('modal-mask');
document.getElementById('btn-reset').addEventListener('click', () => { modalMask.hidden = false; });
document.getElementById('modal-cancel').addEventListener('click', () => { modalMask.hidden = true; });
modalMask.addEventListener('click', ev => { if (ev.target === modalMask) modalMask.hidden = true; });
document.getElementById('modal-ok').addEventListener('click', () => {
  modalMask.hidden = true;
  if (!pickerBox.hidden) closePicker(false); // 放弃取色器预览，避免其回退覆盖重置结果
  try { localStorage.removeItem(SAVED_SETTINGS_KEY); } catch { /* 同上 */ }
  Object.assign(settings, CLOUD_TRAIN_DEFAULTS);
  syncUI();
  boot();
});
document.getElementById('panel-head').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('collapsed');
  document.getElementById('panel-toggle').textContent =
    document.getElementById('panel').classList.contains('collapsed') ? '▴' : '▾';
});

// ======== 自定义取色器（替代浏览器原生弹窗：选色只预览，点「确认」才应用） ========
const hsv2rgb = (h, s, v) => [5, 3, 1].map(n => {
  const k = (n + h / 60) % 6;
  return Math.round(255 * (v - v * s * Math.max(Math.min(k, 4 - k, 1), 0)));
});
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = Math.round(h * 60); if (h < 0) h += 360;
  }
  return { h, s: max === 0 ? 0 : d / max, v: max };
}
const rgb2hex = (r, g, b) => '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
const hex2rgb = hex => ({ r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16) });

const pickerBox = document.getElementById('picker');
const pickerControls = document.getElementById('controls');
const pickerTitle = document.getElementById('picker-title');
const sv = document.getElementById('picker-sv');
const dot = document.getElementById('picker-dot');
const pickerSwatch = document.getElementById('picker-swatch');
const hueEl = document.getElementById('picker-hue');
const rEl = document.getElementById('picker-r'), gEl = document.getElementById('picker-g'), bEl = document.getElementById('picker-b');
let pickerKey = null, pH = 0, pS = 0, pV = 1, pickerStartHex = '#ffffff';

function renderPicker(fromInputs) {
  const [r, g, b] = hsv2rgb(pH, pS, pV);
  const hex = rgb2hex(r, g, b);
  pickerSwatch.style.background = hex;
  dot.style.left = (pS * 100) + '%';
  dot.style.top = ((1 - pV) * 100) + '%';
  sv.style.background = `linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #fff, hsl(${pH},100%,50%))`;
  if (!fromInputs) { rEl.value = r; gEl.value = g; bEl.value = b; }
  // 实时预览：选色过程中背景同步变化
  if (pickerKey) {
    settings[pickerKey] = hex;
    document.getElementById('ctl-' + pickerKey).style.background = hex;
    wakeRef.current();
  }
}
function setPickerFromRgb(r, g, b, fromInputs) {
  const hsv = rgb2hsv(r, g, b);
  if (hsv.s > 0) pH = hsv.h; // 纯灰/白/黑保持原色相
  pS = hsv.s; pV = hsv.v;
  hueEl.value = pH;
  renderPicker(fromInputs);
}
function openPicker(key) {
  if (pickerKey && pickerKey !== key) closePicker(false); // 切换染色前，先回退上一个未确认的修改
  pickerKey = key;
  pickerStartHex = settings[key];
  pickerTitle.textContent = (CLOUD_TRAIN_TINTS.find(t => t[0] === key) || ['', ''])[1] || '调整颜色';
  const { r, g, b } = hex2rgb(settings[key]);
  setPickerFromRgb(r, g, b, false);
  pickerControls.hidden = true; // 取色器占据滑杆列表的位置
  pickerBox.hidden = false;
}
// 关闭：commit=true 确认保留；否则回退到打开时的颜色
function closePicker(commit) {
  if (!pickerKey) return;
  if (!commit) {
    settings[pickerKey] = pickerStartHex;
    document.getElementById('ctl-' + pickerKey).style.background = pickerStartHex;
    wakeRef.current();
  }
  pickerKey = null;
  pickerBox.hidden = true;
  pickerControls.hidden = false;
}
// SV 面板：按下并拖动取饱和度/亮度
let svDrag = false;
function svPick(ev) {
  const rect = sv.getBoundingClientRect();
  pS = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
  pV = Math.min(1, Math.max(0, 1 - (ev.clientY - rect.top) / rect.height));
  renderPicker(false);
}
sv.addEventListener('pointerdown', ev => { svDrag = true; sv.setPointerCapture(ev.pointerId); svPick(ev); });
sv.addEventListener('pointermove', ev => { if (svDrag) svPick(ev); });
sv.addEventListener('pointerup', () => { svDrag = false; });
hueEl.addEventListener('input', () => { pH = parseInt(hueEl.value); renderPicker(false); });
for (const el of [rEl, gEl, bEl]) el.addEventListener('input', () => {
  const clamp = x => Math.min(255, Math.max(0, Math.round(parseFloat(x) || 0)));
  setPickerFromRgb(clamp(rEl.value), clamp(gEl.value), clamp(bEl.value), true);
});
// 吸管从屏幕取色（Chromium 支持 EyeDropper API 时显示）
const eyeBtn = document.getElementById('picker-eyedropper');
if (typeof EyeDropper !== 'undefined') {
  eyeBtn.addEventListener('click', async () => {
    try {
      const res = await new EyeDropper().open();
      const { r, g, b } = hex2rgb(res.sRGBHex);
      setPickerFromRgb(r, g, b, false);
    } catch { /* 用户取消取色 */ }
  });
} else eyeBtn.style.display = 'none';
// 「确认」保留当前颜色；「X」或 Esc 视为取消，颜色跳回打开前的状态
document.getElementById('picker-ok').addEventListener('click', () => closePicker(true));
document.getElementById('picker-close').addEventListener('click', () => closePicker(false));
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !pickerBox.hidden) closePicker(false); });
</script>
</body>

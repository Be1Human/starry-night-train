<body><main>
<header><div><h1>最小案例 B · 列车、轮轴与蒸汽</h1><p>独立局部坐标、SDF 构件、按行进里程旋转的车轮、世界空间烟团。</p></div><a href="../index.html">返回 TA 方案 ↗</a></header>
<div class="scene"><canvas id="stage" aria-label="最小案例 B · 列车、轮轴与蒸汽实时着色器案例"></canvas><div id="error" role="alert" hidden></div></div>
<div class="toolbar"><button id="pause" type="button">暂停</button><button id="reset" type="button">复位</button><label>行进速度<input data-setting="speed" type="range" min="0" max="2" value="1" step="0.1"><output>1.0</output></label><label>烟的风速<input data-setting="wind" type="range" min="0" max="2" value="1" step="0.1"><output>1.0</output></label><label>画质<select data-setting="scale"><option value="0.5">0.5×</option><option value="0.65" selected>0.65×</option><option value="1">1×</option></select></label></div>

<footer>这是放大后的固定机车观察镜头，移动量体现在轮子和连杆上。切到组合样片的定机位，可观察车身从画面通过。<br>当前文件内嵌所需矢量轮廓、GLSL、宿主代码与样式，无外部请求，可直接保存并双击运行。拖动时间条会暂停；空格切换播放。CPU 显示的是指令提交时间，不等于 GPU 帧耗。</footer>
</main><script>window.LAB_CONFIG={"mode":1,"id":"train"};window.LAB_FRAGMENT="#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\nuniform vec2 uRes;\nuniform float uTime, uSpeed, uWind, uDetail, uRipple, uFollow;\nuniform int uMode, uDebug;\nconst float ASPECT = 2.6666667;\nconst float HORIZON = 0.265;\nconst float DECK = 0.375;\nconst float TAU = 6.2831853;\n\n// All examples use the same world: +x right, +y up, 1 unit = picture height.\nfloat hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\nfloat noise(vec2 p) {\n  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);\n  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);\n}\nfloat fbm(vec2 p) { return .57*noise(p)+.28*noise(p*2.03+9.2)+.15*noise(p*4.11+17.6); }\nfloat box(vec2 p, vec2 c, vec2 r) {\n  vec2 q = abs(p-c)-r;\n  return length(max(q,0.0))+min(max(q.x,q.y),0.0);\n}\nfloat mask(float d) { return 1.0-smoothstep(-.7/uRes.y,.7/uRes.y,d); }\nfloat capsule(vec2 p, vec2 a, vec2 b, float r) {\n  vec2 v=b-a; return length(p-a-v*clamp(dot(p-a,v)/dot(v,v),0.0,1.0))-r;\n}\nvec3 over(vec3 back, vec4 front) { return mix(back,front.rgb,front.a); }\nvoid paint(inout vec4 c, float d, vec3 rgb) {\n  float a=mask(d), combined=a+c.a*(1.0-a);\n  c.rgb=(rgb*a+c.rgb*c.a*(1.0-a))/max(combined,.00001);\n  c.a=combined;\n}\nfloat travel(float t) { return t*uSpeed*.085; }\nfloat cameraAt(float t) { return -travel(t)*uFollow; }\nfloat headAt(float t) {\n  // Whole train is outside the image when the fixed-camera loop wraps.\n  return uFollow>.5 ? 1.67-travel(t) : mod(1.67-travel(t)+.9,ASPECT+1.8)-.9;\n}\nvec3 sky(vec2 p) {\n  vec3 color=mix(vec3(.58,.83,.98),vec3(.035,.38,.91),smoothstep(.24,1.05,p.y));\n  return color+vec3(.025,.025,.012)*exp(-dot(p-vec2(.75,.96),p-vec2(.75,.96))*2.0);\n}\n// Train-local +x points toward its nose. Body, wheels and rods share this pivot.\nconst float WHEEL_RADIUS=.009;\nvoid wheel(inout vec4 c, vec2 q, vec2 center, float phase) {\n  vec2 d=q-center;\n  paint(c,length(d)-WHEEL_RADIUS,vec3(.04,.12,.20));\n  float spoke=abs(sin(atan(d.y,d.x)-phase)*length(d));\n  if(length(d)<WHEEL_RADIUS*.8) paint(c,spoke-.0011,vec3(.33,.48,.56));\n  paint(c,length(d)-.0019,vec3(.53,.65,.65));\n}\nvec4 locomotive(vec2 q, float t) {\n  if(q.x<-.77||q.x>.03||q.y<-.002||q.y>.085) return vec4(0);\n  vec4 c=vec4(0);\n  vec3 body=vec3(.055,.19,.29), edge=vec3(.13,.32,.42), dark=vec3(.03,.10,.17);\n  paint(c,box(q,vec2(-.086,.015),vec2(.086,.004)),dark);\n  paint(c,box(q,vec2(-.065,.039),vec2(.050,.014))-.003,body);\n  paint(c,box(q,vec2(-.127,.041),vec2(.023,.030)),body);\n  paint(c,box(q,vec2(-.127,.073),vec2(.028,.003)),dark);\n  paint(c,box(q,vec2(-.126,.051),vec2(.012,.010)),vec3(.95,.85,.48));\n  paint(c,box(q,vec2(-.025,.064),vec2(.006,.015)),body);\n  paint(c,box(q,vec2(-.025,.080),vec2(.010,.003)),dark);\n  paint(c,box(q,vec2(-.012,.039),vec2(.006,.019)),edge);\n  paint(c,box(q,vec2(-.067,.054),vec2(.045,.0013)),edge);\n  paint(c,box(q,vec2(-.195,.037),vec2(.034,.021)),body);\n  paint(c,box(q,vec2(-.195,.061),vec2(.034,.004)),dark);\n  paint(c,box(q,vec2(-.171,.014),vec2(.021,.002)),edge);\n  float phase=-travel(t)/WHEEL_RADIUS;\n  for(int i=0;i<4;i++) wheel(c,q,vec2(-.108+float(i)*.026,.009),phase);\n  wheel(c,q,vec2(-.215,.009),phase); wheel(c,q,vec2(-.175,.009),phase);\n  vec2 crank=vec2(cos(phase),sin(phase))*.005;\n  paint(c,capsule(q,vec2(-.108,.009)+crank,vec2(-.030,.009)+crank,.0015),vec3(.60,.69,.68));\n  // Two identical coaches. Index arithmetic keeps the code independent of train length.\n  for(int i=0;i<2;i++) {\n    float cx=-.36-float(i)*.245;\n    paint(c,box(q,vec2(cx,.036),vec2(.112,.023))-.004,body);\n    paint(c,box(q,vec2(cx,.062),vec2(.115,.004)),dark);\n    paint(c,box(q,vec2(cx,.022),vec2(.110,.0015)),edge);\n    paint(c,box(q,vec2(cx+.126,.018),vec2(.013,.002)),dark);\n    for(int j=0;j<7;j++) {\n      float x=cx-.084+float(j)*.028;\n      paint(c,box(q,vec2(x,.043),vec2(.007,.005)),vec3(.96,.85,.50));\n    }\n    wheel(c,q,vec2(cx-.080,.009),phase); wheel(c,q,vec2(cx+.080,.009),phase);\n  }\n  return c;\n}\nvec4 train(vec2 p,float t) {\n  return locomotive(vec2(headAt(t)-(p.x+cameraAt(t)),p.y-DECK),t);\n}\nvec4 steam(vec2 p,float t) {\n  vec4 result=vec4(0);\n  const float life=4.8;\n  for(int i=0;i<10;i++) {\n    float age=mod(t+float(i)*life/10.0,life);\n    float birth=t-age;\n    // Emit in world space at birth. Old puffs must not stick to the current chimney.\n    vec2 born=vec2(headAt(birth)+.025,DECK+.081);\n    vec2 center=born+vec2((.022+uWind*.012)*age,.032*age);\n    center.x-=cameraAt(t);\n    float radius=.009+.011*age;\n    vec2 q=(p-center)/vec2(1.6,1.0);\n    float d=length(q)-radius+(noise(q*180.0+float(i))-.5)*radius*.25;\n    float a=mask(d)*(1.0-smoothstep(life*.45,life,age))*.72;\n    result.rgb=mix(result.rgb,vec3(.95,.98,.98),a);\n    result.a=result.a+(1.0-result.a)*a;\n  }\n  // Return straight-alpha color to match over().\n  result.rgb=vec3(.95,.98,.98);\n  return result;\n}\n\nvoid main(){vec2 p=vec2(gl_FragCoord.x/uRes.x*ASPECT,gl_FragCoord.y/uRes.y);vec2 q=vec2((.40-p.x)/2.65,(p.y-.29)/2.65);vec3 c=over(mix(vec3(.86,.92,.92),vec3(.66,.82,.88),p.y),locomotive(q,uTime));c=mix(c,vec3(.2,.35,.4),mask(abs(p.y-.28)-.006));vec2 w=vec2(headAt(uTime)-cameraAt(uTime)-q.x,DECK+q.y);c=over(c,steam(w,uTime));gl_FragColor=vec4(c,1.);}";
// Authoring data -> four nested masks. Geometry is explicitly traced from the
// reference SVG, then rasterized once. The PNG is not a runtime input.
function prepareCloudMasks(gl,data) {
  const canvas=document.createElement('canvas');canvas.width=data.width;canvas.height=data.height;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
  const labels=['rgb(255,32,0)','rgb(255,96,0)','rgb(255,160,0)','rgb(255,224,0)'];
  // Preserve source painter order, including non-cloud paths that occlude it.
  for(const [d,x,y,layer] of data.paths){ctx.setTransform(1,0,0,1,x,y);ctx.fillStyle=layer<0?'#000':labels[layer];ctx.fill(new Path2D(d));}
  ctx.resetTransform();
  const rgba=ctx.getImageData(0,0,data.width,data.height).data;
  const masks=new Uint8Array(rgba.length),ridge=data.roi;
  const ramp=(v,a,b)=>Math.max(0,Math.min(1,(v-a)/(b-a)));
  for(let x=0;x<data.width;x++){
    const end=ridge.findIndex(p=>p[0]>=x),b=ridge[Math.max(1,end)],a=ridge[Math.max(0,end-1)];
    const bottom=a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);
    for(let y=0;y<Math.min(bottom,data.height);y++){
      const k=(y*data.width+x)*4,coverage=rgba[k],label=coverage?rgba[k+1]*255/coverage:0;
      masks[k]=coverage;
      masks[k+1]=Math.round(coverage*ramp(label,48,80));
      masks[k+2]=Math.round(coverage*ramp(label,112,144));
      masks[k+3]=Math.round(coverage*ramp(label,176,208));
    }
  }
  const texture=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,data.width,data.height,0,gl.RGBA,gl.UNSIGNED_BYTE,masks);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return {texture,width:data.width,height:data.height,bytes:masks.byteLength,paths:data.paths.length};
}

// Small shared host, inlined into each generated single-file example.
(() => {
  'use strict';
  const config = window.LAB_CONFIG;
  const canvas = document.getElementById('stage');
  const error = document.getElementById('error');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const defaults = { speed: 1, wind: 1, detail: 1, ripple: 1, follow: 1, debug: 0, scale: .65 };
  let settings = { ...defaults }, time = 0, paused = reduced.matches;
  let gl, program, locations, timer, pendingQuery, cloudMaskInfo=null, raf = 0, last = null, parentVisible = true, lost = false;
  let frames = 0, cpuMs = 0, gpuMs = null, measuredFps = 0, windowFrames = 0, windowStart = performance.now();
  let renderer = 'unavailable';
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embedded');
  function compile(type, source) {
    const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const message = gl.getShaderInfoLog(shader); gl.deleteShader(shader); throw new Error(message);
    }
    return shader;
  }
  function resize() {
    if (!gl || lost) return;
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(1, Math.min(1920, Math.round(rect.width * settings.scale)));
    const height = Math.max(1, Math.round(width * 3 / 8));
    if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
    gl.viewport(0, 0, width, height); draw();
  }
  function initialize() {
    gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true });
    if (!gl) throw new Error('当前浏览器未提供 WebGL，无法运行着色器案例。');
    const vertex = compile(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){gl_Position=vec4(a,0.,1.);}');
    const fragment = compile(gl.FRAGMENT_SHADER, window.LAB_FRAGMENT);
    program = gl.createProgram(); gl.attachShader(program, vertex); gl.attachShader(program, fragment); gl.linkProgram(program);
    gl.deleteShader(vertex); gl.deleteShader(fragment);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const attribute = gl.getAttribLocation(program, 'a');
    gl.enableVertexAttribArray(attribute); gl.vertexAttribPointer(attribute, 2, gl.FLOAT, false, 0, 0);
    locations = Object.fromEntries(['uRes', 'uTime', 'uSpeed', 'uWind', 'uDetail', 'uRipple', 'uFollow', 'uMode', 'uDebug', 'uCloudMasks'].map(name => [name, gl.getUniformLocation(program, name)]));
    cloudMaskInfo=config.cloudPatterns?prepareCloudMasks(gl,config.cloudPatterns):null;
    const debug = gl.getExtension('WEBGL_debug_renderer_info');
    renderer = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    timer = gl.getExtension('EXT_disjoint_timer_query'); pendingQuery = null;
    lost = false; error.hidden = true; resize(); schedule();
  }
  function draw() {
    if (!gl || lost) return;
    const start = performance.now();
    if (timer && pendingQuery && timer.getQueryObjectEXT(pendingQuery, timer.QUERY_RESULT_AVAILABLE_EXT)) {
      gpuMs = gl.getParameter(timer.GPU_DISJOINT_EXT) ? null : timer.getQueryObjectEXT(pendingQuery, timer.QUERY_RESULT_EXT) / 1e6;
      timer.deleteQueryEXT(pendingQuery); pendingQuery = null;
    }
    let query = null;
    if (timer && !pendingQuery) { query = timer.createQueryEXT(); timer.beginQueryEXT(timer.TIME_ELAPSED_EXT, query); }
    gl.uniform2f(locations.uRes, canvas.width, canvas.height);
    gl.uniform1f(locations.uTime, time);
    for (const key of ['speed', 'wind', 'detail', 'ripple', 'follow']) gl.uniform1f(locations['u' + key[0].toUpperCase() + key.slice(1)], settings[key]);
    gl.uniform1i(locations.uMode, config.mode); gl.uniform1i(locations.uDebug, settings.debug);
    if(cloudMaskInfo){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,cloudMaskInfo.texture);gl.uniform1i(locations.uCloudMasks,0);}
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (query) { timer.endQueryEXT(timer.TIME_ELAPSED_EXT); pendingQuery = query; }
    cpuMs = cpuMs * .9 + (performance.now() - start) * .1;
    frames++; windowFrames++;
    if (performance.now() - windowStart > 1000) {
      measuredFps = windowFrames / ((performance.now() - windowStart) / 1000);
      windowFrames = 0; windowStart = performance.now();
    }
    document.getElementById('metrics').textContent = `${canvas.width} × ${canvas.height} · ${paused ? '已暂停' : measuredFps.toFixed(1) + ' fps'} · CPU 提交 ${cpuMs.toFixed(2)} ms · GPU ${gpuMs === null ? '未测' : gpuMs.toFixed(2) + ' ms'}`;
    document.getElementById('timeline').value = Math.min(time, 60);
    document.getElementById('clock').textContent = time.toFixed(1) + ' s';
  }
  function active() { return !paused && !lost && !document.hidden && parentVisible; }
  function schedule() { if (!raf && active()) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    if (!active()) { last = null; return; }
    if (last === null) last = now;
    const dt = now - last;
    if (dt >= 1000 / 30 - .4) { time += Math.min(dt / 1000, .1); last = now; draw(); }
    schedule();
  }
  function resetClock() {
    cancelAnimationFrame(raf); raf = 0; last = null; windowStart = performance.now(); windowFrames = 0;
    document.getElementById('pause').textContent = paused ? '播放' : '暂停'; schedule();
  }
  function setSettings(patch) {
    for (const key of ['speed', 'wind', 'detail', 'ripple']) {
      if (typeof patch[key] === 'number' && Number.isFinite(patch[key])) settings[key] = Math.max(0, Math.min(2, patch[key]));
    }
    if (patch.follow === 0 || patch.follow === 1) settings.follow = patch.follow;
    if ([0, 1, 2, 3, 4, 5, 6].includes(patch.debug)) settings.debug = patch.debug;
    if ([.5, .65, 1].includes(patch.scale)) settings.scale = patch.scale;
    for (const element of document.querySelectorAll('[data-setting]')) {
      element.value = settings[element.dataset.setting];
      const output = element.parentElement.querySelector('output'); if (output) output.value = Number(element.value).toFixed(1);
    }
    resize();
  }
  for (const element of document.querySelectorAll('[data-setting]')) element.addEventListener('input', () => setSettings({ [element.dataset.setting]: Number(element.value) }));
  document.getElementById('pause').addEventListener('click', () => { paused = !paused; resetClock(); });
  document.getElementById('reset').addEventListener('click', () => { time = 0; setSettings(defaults); resetClock(); });
  document.getElementById('timeline').addEventListener('input', event => { paused = true; time = Number(event.target.value); draw(); resetClock(); });
  document.addEventListener('visibilitychange', resetClock);
  reduced.addEventListener('change', () => { paused = reduced.matches; resetClock(); });
  addEventListener('message', event => {
    if (event.source === parent && event.data?.type === 'ta-lab-visibility') { parentVisible = !!event.data.visible; resetClock(); }
  });
  document.addEventListener('keydown', event => {
    if (event.target instanceof Element && event.target.matches('input,select,textarea')) return;
    if (event.code === 'Space') { event.preventDefault(); paused = !paused; resetClock(); }
  });
  canvas.addEventListener('webglcontextlost', event => { event.preventDefault(); lost = true; resetClock(); error.textContent = 'WebGL 上下文暂时丢失，等待恢复。'; error.hidden = false; });
  canvas.addEventListener('webglcontextrestored', () => { try { initialize(); } catch (cause) { error.hidden = false; error.textContent = cause.message; } });
  new ResizeObserver(resize).observe(canvas);
  window.TALab = {
    renderAt(value) { paused = true; time = Math.max(0, Number(value) || 0); resetClock(); draw(); },
    setSettings,
    setPaused(value) { paused = !!value; resetClock(); },
    get state() { return { ready: !!program && !lost, time, paused, frames, settings: { ...settings }, resolution: [canvas.width, canvas.height], cpuSubmitMs: cpuMs, gpuMs, measuredFps, renderer, cloudMask:cloudMaskInfo?{width:cloudMaskInfo.width,height:cloudMaskInfo.height,bytes:cloudMaskInfo.bytes,paths:cloudMaskInfo.paths}:null }; },
    pixels() { const pixels = new Uint8Array(canvas.width * canvas.height * 4); gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels); return pixels; },
    getError() { return gl.getError(); }
  };
  try { initialize(); resetClock(); } catch (cause) { error.textContent = '着色器初始化失败：' + cause.message; error.hidden = false; console.error(cause); }
})();
